apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apppagodirecto
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Husifork/argocdtestin'
    targetRevision: HEAD
    path: 'apps/appPagoDirecto'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: app-db-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true